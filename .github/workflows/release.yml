name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify:
    uses: ./.github/workflows/check.yml
  build:
    needs: [verify]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release
        run: cargo build --release
        env:
          MAA_FLEET_GIT_SHA: ${{ github.sha }}
      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/maa-fleet-updater.exe dist/
          Copy-Item config.example.json, README.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath maa-fleet-updater-win-x64.zip -Force
          $hash = (Get-FileHash maa-fleet-updater-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  maa-fleet-updater-win-x64.zip`n" | Out-File -FilePath maa-fleet-updater-win-x64.zip.sha256 -Encoding ascii -NoNewline
          $tag = "${{ github.ref_name }}"
          $zipLen = (Get-Item maa-fleet-updater-win-x64.zip).Length
          $sumLen = (Get-Item maa-fleet-updater-win-x64.zip.sha256).Length
          $base = "https://github.com/ModerRAS/maa-fleet-updater/releases/download/$tag"
          $manifest = [ordered]@{
            tag_name = $tag
            commit = "${{ github.sha }}"
            assets = @(
              [ordered]@{ name = "maa-fleet-updater-win-x64.zip"; browser_download_url = "$base/maa-fleet-updater-win-x64.zip"; size = $zipLen },
              [ordered]@{ name = "maa-fleet-updater-win-x64.zip.sha256"; browser_download_url = "$base/maa-fleet-updater-win-x64.zip.sha256"; size = $sumLen }
            )
          }
          ($manifest | ConvertTo-Json -Depth 5) | Out-File -FilePath latest.json -Encoding ascii
      - name: Create GitHub release
        run: gh release create ${{ github.ref_name }} maa-fleet-updater-win-x64.zip maa-fleet-updater-win-x64.zip.sha256 latest.json --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
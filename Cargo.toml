[package]
name = "maa-fleet-updater"
version = "0.2.15"
edition = "2021"
description = "Fleet updater/launcher for multi-instance MaaAssistantArknights: GitHub-first, OTA by default, boot-window commit"
license = "GPL-3.0-only"

[[bin]]
name = "maa-fleet-updater"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "time", "sync", "signal", "io-util"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["socks", "stream", "json"] }
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sysinfo = "0.30"
semver = "1"
walkdir = "2"
zip = "2"
sha2 = "0.10"
pelite = "0.10"
winreg = "0.52"
